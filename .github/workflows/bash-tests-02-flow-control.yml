name: bash-tests-02-flow-control

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Marcar .sh como ejecutables
        run: |
          find scripts -type f -name '*.sh' -print0 | xargs -0 chmod +x

      - name: Ejecutar tests de 02_flow_control
        run: |
          set -e
          echo "Buscando tests en scripts/tests/02_flow_control ..."
          find scripts/tests/02_flow_control -type f -name 'test_*.sh' | while read -r test_script; do
            echo "Ejecutando $test_script ..."
            if ! bash "$test_script" &> "${test_script%.sh}.log"; then
              echo "$test_script FAILED. Log:"
              cat "${test_script%.sh}.log"
              exit 1
            else
              echo "$test_script OK"
            fi
          done
          echo "Todos los tests de 02_flow_control han pasado correctamente."
