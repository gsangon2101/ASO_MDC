name: bash-tests-02-flow-control

on:
  push:
  pull_request:

jobs:
  test-02-flow-control:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Marcar .sh como ejecutables
        run: |
          find scripts -type f -name '*.sh' -print0 | xargs -0 chmod +x

      - name: Ejecutar todos los test_*.sh de 02_flow_control
        run: |
          set -e
          cd scripts/tests/02_flow_control
          echo "Directorio actual: $(pwd)"
          failed=0

          find . -type f -name 'test_*.sh' | sort | while read -r test_script; do
            echo "=================================================="
            echo "Ejecutando $test_script ..."
            if ! bash "$test_script" &> "${test_script%.sh}.log"; then
              echo "❌ $test_script FAILED. Log:"
              cat "${test_script%.sh}.log"
              failed=1
            else
              echo "✅ $test_script OK"
            fi
          done

          if [[ $failed -ne 0 ]]; then
            echo "Al menos un test ha fallado."
            exit 1
          else
            echo "Todos los tests de 02_flow_control han pasado correctamente."
          fi
